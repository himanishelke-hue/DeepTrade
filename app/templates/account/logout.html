
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Logout | DeepTrade</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
height:100vh;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins',sans-serif;
}

.logout-box{
width:420px;
background:#020617;
padding:40px;
border-radius:10px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.logout-btn{
width:100%;
padding:12px;
background:#2563eb;
border:none;
border-radius:6px;
color:white;
font-weight:600;
cursor:pointer;
margin-top:20px;
}

.logout-btn:hover{
background:#1d4ed8;
}

.cancel{
display:block;
margin-top:15px;
color:#60a5fa;
text-decoration:none;
}

</style>

</head>

<body>

<div class="logout-box">

<h2>Sign Out</h2>
<p>Are you sure you want to logout from DeepTrade?</p>

<form method="post" action="/accounts/logout/">
{% csrf_token %}
<button type="submit" class="logout-btn">Logout</button>
</form>

<a href="/">Cancel</a>

</div>

</body>
