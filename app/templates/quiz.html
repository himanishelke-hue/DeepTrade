{% extends 'base.html' %}

{% block content %}

<div class="container-fluid pt-4 px-4">

    <div class="bg-secondary rounded p-4 text-center">

        <h4 class="text-primary mb-4">Stock Quiz</h4>

        <h5 class="question mb-4"></h5>

        <div class="d-grid gap-3 col-12 col-md-6 mx-auto">

            <button class="btn btn-outline-info" id="option1">A</button>
            <button class="btn btn-outline-info" id="option2">B</button>
            <button class="btn btn-outline-info" id="option3">C</button>
            <button class="btn btn-outline-info" id="option4">D</button>

        </div>

        <div class="mt-5">
            <h5>Your Score: <span class="score">0/12</span></h5>

            <div class="mt-3">
                <button class="btn btn-primary prev">Prev</button>
                <button class="btn btn-primary next">Next</button>
            </div>
        </div>

    </div>

</div>
<script></script>
<!-- JavaScript Libraries -->
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'lib/easing/easing.min.js' %}"></script>
  <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
  <script src="{% static 'lib/tempusdominus/js/moment.min.js' %}"></script>
  <script src="{% static 'lib/tempusdominus/js/moment-timezone.min.js' %}"></script>
  <script src="{% static 'lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js' %}"></script>

  <!-- Template Javascript -->
  <script src="{% static 'js/quiz.js' %}"></script>


{% endblock %}
